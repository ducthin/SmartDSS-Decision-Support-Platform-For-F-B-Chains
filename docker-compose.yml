services:

  # ─────────────────────────────────────────────────────────────────────────────
  # MySQL Database
  # ─────────────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: smartdss-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: smartdss
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"        # Có thể bỏ nếu không cần expose ra ngoài VPS
    networks:
      - smartdss-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────────
  # ML Service (FastAPI Python)
  # ─────────────────────────────────────────────────────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: smartdss-ml
    restart: unless-stopped
    environment:
      - APP_TIMEZONE=Asia/Ho_Chi_Minh
      - RETRAIN_ENABLED=true
      - RETRAIN_INTERVAL_DAYS=7
      - RETRAIN_ORDER_THRESHOLD=1000
      - RETRAIN_CHECK_INTERVAL_MINUTES=30
    volumes:
      - ml_artifacts:/app/artifacts   # Lưu model đã train
      - ml_data:/app/data             # Lưu training data
    ports:
      - "8000:8000"        # Có thể bỏ nếu chỉ Backend gọi nội bộ
    networks:
      - smartdss-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────────────────
  # Backend (Spring Boot Java 24)
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./Backend/Capstone2
      dockerfile: Dockerfile
    container_name: smartdss-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      # Database — trỏ đến service mysql trong cùng network
      DB_URL: jdbc:mysql://mysql:3306/smartdss?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

      # App
      APP_TIMEZONE: Asia/Ho_Chi_Minh
      SHOW_SQL: "false"
      SPRING_DEVTOOLS_RESTART_ENABLED: "false"

      # ML Service — gọi nội bộ qua Docker network
      ML_SERVICE_URL: http://ml-service:8000

      # CORS — thêm domain thật của bạn
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS}

      # External APIs
      WEATHER_API_KEY: ${WEATHER_API_KEY}
      WEATHER_CITY: ${WEATHER_CITY:-Da Nang}
      CALENDARIFIC_API_KEY: ${CALENDARIFIC_API_KEY}

      # Payment
      APP_PAYMENT_BANK_BIN: ${APP_PAYMENT_BANK_BIN:-970422}
      APP_PAYMENT_BANK_ACCOUNT: ${APP_PAYMENT_BANK_ACCOUNT}
      APP_PAYMENT_BANK_ACCOUNT_NAME: ${APP_PAYMENT_BANK_ACCOUNT_NAME:-SMARTDSS CAFE}
      APP_PAYMENT_QR_EXPIRE_MINUTES: ${APP_PAYMENT_QR_EXPIRE_MINUTES:-15}
      APP_PAYMENT_WEBHOOK_SECRET: ${APP_PAYMENT_WEBHOOK_SECRET}
      APP_PAYMENT_WEBHOOK_ALLOW_INSECURE: ${APP_PAYMENT_WEBHOOK_ALLOW_INSECURE:-false}
      APP_PAYOS_CLIENT_ID: ${APP_PAYOS_CLIENT_ID}
      APP_PAYOS_API_KEY: ${APP_PAYOS_API_KEY}
      APP_PAYOS_CHECKSUM_KEY: ${APP_PAYOS_CHECKSUM_KEY}
      APP_PAYOS_RETURN_URL: ${APP_PAYOS_RETURN_URL}
      APP_PAYOS_CANCEL_URL: ${APP_PAYOS_CANCEL_URL}

      # Groq / LLM
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}

      # Mail
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}

      # Notification
      APP_NOTIFICATION_ENABLED: ${APP_NOTIFICATION_ENABLED:-false}
      APP_NOTIFICATION_PROVIDER: ${APP_NOTIFICATION_PROVIDER:-LOG}
      APP_NOTIFICATION_CHANNEL: ${APP_NOTIFICATION_CHANNEL:-LOG}
      APP_NOTIFICATION_STORE_NAME: ${APP_NOTIFICATION_STORE_NAME:-SmartDSS Coffee}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}

      # Logging
      APP_LOG_LEVEL_PAYMENT_SERVICE: INFO
      APP_LOG_LEVEL_PAYMENT_WEBHOOK: INFO
    volumes:
      - backend_uploads:/app/uploads   # Lưu file upload
    ports:
      - "8080:8080"
    networks:
      - smartdss-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend (React/Vite → Nginx)
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend/smartdss-frontend
      dockerfile: Dockerfile
      args:
        # VITE_ vars được embed vào JS lúc build — phải có domain thật ở đây
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
    container_name: smartdss-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - smartdss-net

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  ml_artifacts:
    driver: local
  ml_data:
    driver: local
  backend_uploads:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  smartdss-net:
    driver: bridge
