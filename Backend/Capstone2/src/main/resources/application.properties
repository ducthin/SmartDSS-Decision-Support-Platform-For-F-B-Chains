spring.application.name=Capstone2
spring.config.import=optional:file:.env[.properties],optional:file:SmartDSS/Backend/.env[.properties],optional:file:../Backend/.env[.properties],optional:file:../.env[.properties]
spring.devtools.restart.enabled=${SPRING_DEVTOOLS_RESTART_ENABLED:false}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartdss?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia%2FHo_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Upload limits
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:6MB}

# Upload directory (absolute path recommended; defaults to ./uploads relative to working dir)
app.upload.dir=${UPLOAD_DIR:}

# JWT
# Base64 default key for local development (256-bit); override JWT_SECRET in production.
# Generated with: openssl rand -base64 32
app.jwt.secret=${JWT_SECRET:dGhpc0lzVGhpc0lzVGhpc0lzVGhpc0lzVGhpc0lzVGhpc0lzVGg=}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
app.timezone=${APP_TIMEZONE:Asia/Ho_Chi_Minh}
app.db.timezone=${APP_DB_TIMEZONE:${APP_TIMEZONE:Asia/Ho_Chi_Minh}}

# Weather API (OpenWeatherMap)
weather.api.key=${WEATHER_API_KEY}
weather.api.city=${WEATHER_CITY:Da Nang}
weather.api.url=https://api.openweathermap.org/data/2.5/weather
weather.api.fetch-interval=3600000

# Calendarific API
calendarific.api.key=${CALENDARIFIC_API_KEY}

# Area busyness insights (OpenStreetMap Overpass)
area.busyness.overpass-url=${AREA_BUSYNESS_OVERPASS_URL:https://overpass-api.de/api/interpreter}
area.busyness.radius-meters=${AREA_BUSYNESS_RADIUS_METERS:800}
area.busyness.cache-seconds=${AREA_BUSYNESS_CACHE_SECONDS:600}
area.busyness.request-timeout-ms=${AREA_BUSYNESS_TIMEOUT_MS:5000}
area.busyness.retry-max-attempts=${AREA_BUSYNESS_RETRY_MAX_ATTEMPTS:2}
area.busyness.retry-backoff-ms=${AREA_BUSYNESS_RETRY_BACKOFF_MS:600}
area.busyness.circuit-open-seconds=${AREA_BUSYNESS_CIRCUIT_OPEN_SECONDS:120}

# ML Python Microservice (SmartDSS AI Prediction)
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.timeout-ms=${ML_SERVICE_TIMEOUT_MS:6000}

# LLM so sánh với dự báo ML (GET /api/v1/predictions?compareLlm=true)
# Groq: OpenAI-compatible — mặc định base-url Groq; key dùng GROQ_API_KEY hoặc OPENAI_API_KEY
openai.api-key=${OPENAI_API_KEY:${GROQ_API_KEY:}}
openai.model=${GROQ_MODEL:${OPENAI_MODEL:llama-3.3-70b-versatile}}
openai.base-url=${OPENAI_BASE_URL:https://api.groq.com/openai/v1}
openai.timeout-ms=${OPENAI_TIMEOUT_MS:45000}
# Groq: hầu hết model hỗ trợ json_object; nếu lỗi thì đặt false
openai.use-json-response-format=${OPENAI_USE_JSON_RESPONSE_FORMAT:true}

# Data seeding (enable only in dev)
app.seed.enabled=${APP_SEED_ENABLED:false}
# Xóa toàn bộ menu + công thức + dòng order/sales liên quan rồi seed lại (chỉ dev; cần app.seed.enabled=true)
app.seed.resetMenu=${APP_SEED_RESET_MENU:false}

# CORS / WebSocket allowed origins (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://smartdss.store,http://46.224.154.69,https://46.224.154.69,http://localhost:5173,http://localhost:5174,http://localhost:3000}
app.ws.allowed-origins=${WS_ALLOWED_ORIGINS:https://smartdss.store,http://46.224.154.69,https://46.224.154.69,http://localhost:5173,http://localhost:5174,http://localhost:3000}

# Sync missing roles into DB on startup (safe)
app.roles.sync-enabled=${APP_ROLES_SYNC_ENABLED:true}

# One-time migration: merge legacy WAITER/BARISTA roles into STAFF
app.roles.migrate-merge-service-roles=${APP_ROLES_MIGRATE_MERGE_SERVICE_ROLES:true}

# Feedback anti-spam & alert tuning
app.feedback.image.max-size-mb=${APP_FEEDBACK_IMAGE_MAX_SIZE_MB:5}
app.feedback.image.max-count=${APP_FEEDBACK_IMAGE_MAX_COUNT:5}
app.feedback.spam.cooldown-minutes=${APP_FEEDBACK_SPAM_COOLDOWN_MINUTES:2}
app.feedback.spam.max-per-phone-24h=${APP_FEEDBACK_SPAM_MAX_PER_PHONE_24H:5}
app.feedback.spam.max-per-table-per-minute=${APP_FEEDBACK_SPAM_MAX_PER_TABLE_PER_MINUTE:3}
app.feedback.alert.low-rating-threshold=${APP_FEEDBACK_ALERT_LOW_RATING_THRESHOLD:2}
app.feedback.alert.critical-low-rating-count=${APP_FEEDBACK_ALERT_CRITICAL_LOW_RATING_COUNT:2}
app.feedback.alert.window-minutes=${APP_FEEDBACK_ALERT_WINDOW_MINUTES:30}

# Vietnam VAT policy
app.tax.vat.rate-percent=${APP_TAX_VAT_RATE_PERCENT:8}
app.tax.vat.price-includes-vat=${APP_TAX_PRICE_INCLUDES_VAT:true}

# POS payment (VietQR + webhook)
app.payment.bank.bin=${APP_PAYMENT_BANK_BIN:970422}
app.payment.bank.account=${APP_PAYMENT_BANK_ACCOUNT:0123456789}
app.payment.bank.account-name=${APP_PAYMENT_BANK_ACCOUNT_NAME:SMARTDSS CAFE}
app.payment.qr.expire-minutes=${APP_PAYMENT_QR_EXPIRE_MINUTES:15}
app.payment.webhook.secret=${APP_PAYMENT_WEBHOOK_SECRET:}
app.payment.webhook.allow-insecure=${APP_PAYMENT_WEBHOOK_ALLOW_INSECURE:false}

# Customer notifications (SMS/Zalo through provider API or webhook)
app.notification.enabled=${APP_NOTIFICATION_ENABLED:false}
app.notification.provider=${APP_NOTIFICATION_PROVIDER:LOG}
app.notification.channel=${APP_NOTIFICATION_CHANNEL:ZALO}
app.notification.webhook-url=${APP_NOTIFICATION_WEBHOOK_URL:}
app.notification.api-key=${APP_NOTIFICATION_API_KEY:}
app.notification.store-name=${APP_NOTIFICATION_STORE_NAME:SmartDSS Coffee}
app.notification.timeout-ms=${APP_NOTIFICATION_TIMEOUT_MS:8000}
app.notification.esms.secret-key=${ESMS_SECRET_KEY:}
app.notification.esms.brandname=${ESMS_BRANDNAME:}
app.notification.esms.sms-type=${ESMS_SMS_TYPE:2}
app.notification.esms.sandbox=${ESMS_SANDBOX:0}
app.notification.speedsms.access-token=${SPEEDSMS_ACCESS_TOKEN:}
app.notification.speedsms.sms-type=${SPEEDSMS_SMS_TYPE:2}
app.notification.speedsms.sender=${SPEEDSMS_SENDER:}
app.notification.infobip.base-url=${INFOBIP_BASE_URL:}
app.notification.infobip.api-key=${INFOBIP_API_KEY:}
app.notification.infobip.sender=${INFOBIP_SENDER:InfoSMS}
app.notification.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.notification.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.notification.twilio.from=${TWILIO_FROM:}
app.notification.twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}
app.notification.stringee.base-url=${STRINGEE_BASE_URL:https://api.stringeex.com}
app.notification.stringee.auth-token=${STRINGEE_AUTH_TOKEN:}
app.notification.stringee.api-key-sid=${STRINGEE_API_KEY_SID:}
app.notification.stringee.api-key-secret=${STRINGEE_API_KEY_SECRET:}
app.notification.stringee.sms-sender-id=${STRINGEE_SMS_SENDER_ID:}
app.notification.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.notification.telegram.chat-id=${TELEGRAM_CHAT_ID:}
app.notification.telegram.bot-username=${TELEGRAM_BOT_USERNAME:}

# Email invoice delivery (Gmail SMTP example)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
app.mail.from=${APP_MAIL_FROM:${MAIL_USERNAME:}}

# PayOS integration config
app.payment.payos.client-id=${APP_PAYOS_CLIENT_ID:}
app.payment.payos.api-key=${APP_PAYOS_API_KEY:}
app.payment.payos.checksum-key=${APP_PAYOS_CHECKSUM_KEY:}
app.payment.payos.return-url=${APP_PAYOS_RETURN_URL:http://localhost:5173/payment/success}
app.payment.payos.cancel-url=${APP_PAYOS_CANCEL_URL:http://localhost:5173/payment/cancel}

# Payment troubleshooting logs
logging.level.C2SE._1.Capstone2.service.impl.PaymentServiceImpl=${APP_LOG_LEVEL_PAYMENT_SERVICE:INFO}
logging.level.C2SE._1.Capstone2.controller.PaymentWebhookController=${APP_LOG_LEVEL_PAYMENT_WEBHOOK:INFO}
logging.pattern.level=${APP_LOGGING_PATTERN_LEVEL:%5p [req:%X{requestId:-}]}

# Actuator / metrics
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_EXPOSE:health,info,metrics}
